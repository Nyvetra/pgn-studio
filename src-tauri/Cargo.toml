[package]
name = "pgn-studio"
version = "0.1.0"
description = "PGN Studio: inspect, validate, consolidate, filter, clean, deduplicate, and export chess games stored in PGN."
authors = ["Nyvetra"]
license = "GPL-3.0-or-later"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pgn_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# NOTE (Phase 0): only the `tauri` core was depended on then; Phase 2a now
# re-adds the dialog/opener plugins below because `select_input_files` /
# `select_output_directory` / `reveal_path` / `open_path` are real commands
# now (design-02 §4.1, architecture.md §16.3). Both plugins are called only
# from Rust command handlers (never invoked directly by the frontend), and
# `reveal_path`/`open_path` additionally allowlist-check every path against
# job history/artifacts before calling the plugin (see `commands::dialogs`).
tauri = { version = "2", features = ["specta"] }
# Phase 2a: native file/folder pickers for the Files/Output screens. The
# frontend never calls this plugin directly - `select_input_files` etc. are
# our own commands that call the plugin's Rust API and re-validate every
# returned path (architecture.md §16.2: the frontend is outside the trust
# boundary).
tauri-plugin-dialog = "2"
# Phase 2a: "reveal in file manager" / "open with default app" for
# `reveal_path`/`open_path`. Same rule: Rust-mediated only, and every path is
# checked against an allowlist derived from job history/artifacts before
# being handed to the plugin (never an arbitrary frontend-supplied path).
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.24.0", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
sha2 = "0.11.0"
thiserror = "2.0.19"
# Phase 1b (job orchestration, §2.2): process spawn, concurrent pipe
# draining, bounded log channel, cancellation timing, the single-flight
# job-slot mutex.
tokio = { version = "1", features = ["full"] }
# Phase 1b (errors/, design-02 §5.2 rule 4): the sole, explicitly-lint-flagged
# escape hatch for UNKNOWN_INTERNAL_ERROR. Not used to avoid mapping specific
# errors - see errors::unknown_internal_error's #[deprecated] shim.
anyhow = "1"
# Phase 1b (errors/, design-02 §5.2 rule 2): structured "full chain to local
# log, keyed by technical_id" - no subscriber is installed by Phase 1b (that
# is application-wiring, Phase 2/main.rs), so these calls are no-ops until
# one is, but the call sites and fields are correct today.
tracing = "0.1"
# Phase 6 (observability/, architecture.md §22.1): the subscriber that
# actually renders every `tracing::*!` call site above (and every one
# added since) to a bounded, rotated local log file - newline-delimited
# JSON, so `timestamp`/`level`/every structured field (`job_id`, `stage`,
# `component`, `code`, ...) are all machine-parseable without a second log
# format to maintain.
tracing-subscriber = { version = "0.3", features = ["json", "time", "fmt"] }
# Phase 6: non-blocking file writer + time-based rotation. Bounded *count*/
# *total size* retention (architecture.md §22.1) is this crate's own
# `observability::retention` sweep on top - `tracing-appender` itself only
# rotates, it never deletes old files.
tracing-appender = "0.2"
# Phase 1b (filesystem/, design-02 §3.1): cross-platform file-identity
# comparison (Windows volume serial + file index / Unix dev+ino) - the exact
# mechanism design-02 names ("the same-file crate's Handle, or direct
# windows-sys calls").
same-file = "1.0.6"
# Phase 2a (commands/, design-02 §4.3, D-17): Rust-to-TypeScript type
# generation for the IPC command/event surface. Pinned to exact prerelease
# versions because tauri-specta/specta have not cut a stable 2.0.0 yet
# (verified against crates.io on 2026-08-10: latest is 2.0.0-rc.25, and
# tauri-specta 2.0.0-rc.25 requires specta =2.0.0-rc.25 exactly). Verified
# compatible with the installed tauri 2.11.5: tauri 2.11.5 defines the
# `specta` feature tauri-specta's own manifest requests.
specta = { version = "=2.0.0-rc.25", features = ["derive", "chrono", "uuid"] }
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }

[target.'cfg(windows)'.dependencies]
# Phase 1b: Job Objects for Windows process-tree control (§2.2, §2.5),
# no-replace atomic rename via MoveFileExW (§3.4 - std::fs::rename always
# replaces on Windows and cannot be used for the Fail/AddNumericSuffix
# conflict policies), file identity/disk-space probes.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Globalization",
] }

[target.'cfg(unix)'.dependencies]
# Phase 1b: setsid (own process group) + process-group SIGTERM/SIGKILL for
# cancellation (§2.2, §2.5). Unverified by compilation on this Windows-only
# development machine - see the final report.
libc = "0.2"

[dev-dependencies]
# Integration tests (design-02's Phase 1 exit criterion): scratch workspaces
# and destination directories that must not collide with the real
# filesystem or with each other across parallel test threads.
tempfile = "3"

# Phase 2a: `xtask` (design-02 §4.3/D-17) regenerates `src/ipc/generated-types.ts`
# via `cargo run -p xtask -- export-bindings`. `src-tauri` is both the app
# package and the workspace root (a standard Cargo "root package + members"
# workspace) so this stays a plain subdirectory of `src-tauri/`, not a
# separate top-level Rust project.
[workspace]
members = ["xtask"]

