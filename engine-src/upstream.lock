      "reproducibility": "/Brepro (cl.exe on engineFlags+treFlags, lib.exe+link.exe on linkFlags) makes the installed pgn-extract-x86_64-pc-windows-msvc.exe byte-for-byte identical across clean rebuilds of the same pinned commit ON THE SAME MSVC TOOLSET, INCLUDING neutralizing argsfile.c's `__DATE__` use (help banner) to a fixed placeholder instead of the real compile date. It removes TIME as a build input, not TOOLCHAIN VERSION: this lock pins the engine sources and flags but NOT cl.exe/link.exe themselves, and MSVC 19.44, MSVC 19.51.36252 (GitHub Actions windows-latest) and a third machine's toolset have each been measured producing a different binary (426496 / 427520 / 427008 bytes). That is expected, and nothing depends on cross-toolset equality - src-tauri/binaries/checksums.json is written by the same build that produced the binary, so no externally-pinned hash exists anywhere in the build/verify/startup path. See engine-src/README.md 'Reproducibility', and its 'What /Brepro does not fix' subsection, for full evidence and how to re-verify."
